<style>
:root{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--lv:#8f78d8;--lvd:#4b3b86;--lvl:#efeafb;--lvm:#d9cff5;--ink:#2b2542}
body{font-family:'Quicksand',Helvetica,Arial,sans-serif;font-weight:500;background:#f7f4fd;color:var(--ink);padding-bottom:86px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1,h2,h3,h4,h5{font-weight:700;letter-spacing:-.01em}
.btn-lv{background:var(--lv);color:#fff;border:0;border-radius:12px;padding:.6rem 1.1rem}
.btn-lv:hover{background:var(--lvd);color:#fff}
.btn-out{border:1.5px solid var(--lv);color:var(--lvd);border-radius:12px;background:#fff}
.form-control,.form-select{border-radius:12px;border-color:var(--lvm)}
.form-control:focus,.form-select:focus{border-color:var(--lv);box-shadow:0 0 0 .2rem rgba(143,120,216,.2)}
.card-s{background:#fff;border:1px solid var(--lvm);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:var(--lv);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.hero small{opacity:.85}
.tile{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--lvm);border-radius:14px;padding:14px;color:var(--ink);height:100%}
.tile svg{width:1.4rem;height:1.4rem;color:var(--lv)}
.tile:hover{background:var(--lvl)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--lvm);border-radius:12px;padding:12px 14px;margin-bottom:10px;color:var(--ink)}
.opt:hover{border-color:var(--lv);background:var(--lvl)}
.progress{height:8px;border-radius:8px;background:var(--lvl)}
.progress-bar{background:var(--lv)}
.chip{display:inline-block;background:var(--lvl);color:var(--lvd);border-radius:20px;padding:3px 11px;font-size:.8rem;margin:0 4px 4px 0}
.chip.on{background:var(--lv);color:#fff}
nav.bn{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--lvm);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:50}
nav.bn button{background:none;border:0;color:#8a84a3;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px}
nav.bn button svg{width:1.3rem;height:1.3rem}
nav.bn button.on{color:var(--lvd);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-weight:700;font-size:1.15rem;color:var(--lvd)}
.bell svg{width:1.3rem;height:1.3rem}.bell{position:relative;background:none;border:0;font-size:1.3rem;color:var(--lvd)}
.bell b{position:absolute;top:-2px;right:-4px;background:#e0527a;color:#fff;border-radius:10px;font-size:.62rem;padding:1px 5px}
#ld{position:fixed;inset:0;background:rgba(247,244,253,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .3s}
#ld.h{opacity:0;pointer-events:none}
.orb{width:54px;height:54px;border-radius:50%;background:var(--lv);animation:pl 1.1s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}
.toastx{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;z-index:98;font-size:.9rem}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
<style>
body{background:linear-gradient(180deg,#ebe4fb 0,#f7f4fd 320px) no-repeat,#f7f4fd}
.brand::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lv);margin-right:8px}
.card-s{border:0;border-radius:18px;box-shadow:0 6px 22px rgba(75,59,134,.07)}
.btn-lv{box-shadow:0 6px 16px rgba(143,120,216,.35)}
.hero{background:linear-gradient(135deg,#7f66cf,#b9a6f0);border-radius:24px;padding:22px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(127,102,207,.3)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}
.hero .chip{background:rgba(255,255,255,.22);color:#fff}

.next{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--lv);border-radius:18px;padding:16px;color:var(--ink)}
.next small{color:var(--lv);font-weight:700;display:block}
.next svg{width:1.6rem;height:1.6rem;color:var(--lv);flex:none}
.tile{border:0;border-radius:18px;padding:16px;box-shadow:0 6px 22px rgba(75,59,134,.07)}
.ico{width:42px;height:42px;border-radius:13px;background:var(--lvl);display:grid;place-items:center;margin-bottom:10px}
.tile .ico svg{width:1.2rem;height:1.2rem}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--lv),#b9a6f0);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.avatar.lg{width:84px;height:84px;font-size:1.6rem}
.opt{border-radius:14px;padding:14px 16px}
nav.bn{border:0;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(75,59,134,.1)}
nav.bn button.on{background:var(--lvl);border-radius:14px}
@keyframes fi{from{opacity:0}to{opacity:1}}
#main{animation:fi .3s ease}
@media(prefers-reduced-motion:reduce){#main{animation:none}}
</style>
<style>
::selection{background:#d9cff5}
body{padding-bottom:104px}
#app,#auth{position:relative;z-index:1}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:dr 16s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:#c9b8f5;top:-60px;left:-60px}
.blobs i:nth-child(2){width:220px;height:220px;background:#f3c9e8;top:38%;right:-80px;animation-delay:-5s}
.blobs i:nth-child(3){width:280px;height:280px;background:#b8c8f5;bottom:-100px;left:15%;animation-delay:-9s}
@keyframes dr{to{transform:translate(40px,60px) scale(1.15)}}
.brand{background:linear-gradient(90deg,#4b3b86,#9a82e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand::before{box-shadow:0 0 12px var(--lv)}
.card-s,.tile,.opt{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75)}
.next{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid rgba(143,120,216,.55);box-shadow:0 8px 24px rgba(143,120,216,.18)}
.hero{background:linear-gradient(120deg,#7a60cc,#b49cf0,#8f78d8);background-size:220% 220%;animation:sh 12s ease infinite}
@keyframes sh{50%{background-position:100% 50%}}
.hero::before,.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 38% 70%,#fff,transparent),radial-gradient(2px 2px at 62% 18%,#fff,transparent),radial-gradient(1px 1px at 82% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 20%,#fff,transparent),radial-gradient(1px 1px at 25% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 72% 88%,#fff,transparent);animation:tw 3.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.ring{box-shadow:0 0 26px rgba(255,255,255,.5)}
.sky{background:linear-gradient(160deg,#2c2150,#5a47a8);color:#fff;position:relative;overflow:hidden}
.sky>*{position:relative}
.sky .text-secondary{color:#d9cff5!important}
.progress-bar{background:linear-gradient(90deg,#8f78d8,#c1b0f5);box-shadow:0 0 10px rgba(143,120,216,.5);animation:gr .9s ease}
@keyframes gr{from{width:0}}
.btn-lv{position:relative;overflow:hidden;background:linear-gradient(135deg,#8f78d8,#a68ff0)}
.btn-lv::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.btn-lv:hover::after{left:130%}
.tile{transition:transform .25s,box-shadow .25s,background .25s}
.tile:hover{transform:translateY(-4px);background:rgba(255,255,255,.92);box-shadow:0 14px 30px rgba(143,120,216,.28)}
.ico{transition:background .25s}
.tile:hover .ico{background:linear-gradient(135deg,#8f78d8,#b9a6f0)}
.tile:hover .ico svg{color:#fff}
.opt{transition:transform .2s,box-shadow .2s,border-color .2s}
.opt:hover{transform:translateX(4px);box-shadow:0 8px 20px rgba(143,120,216,.2)}
.row.g-2>.col-6{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.row.g-2>.col-6:nth-child(1){animation-delay:0.11s}.row.g-2>.col-6:nth-child(2){animation-delay:0.17s}.row.g-2>.col-6:nth-child(3){animation-delay:0.23s}.row.g-2>.col-6:nth-child(4){animation-delay:0.29s}.row.g-2>.col-6:nth-child(5){animation-delay:0.35s}.row.g-2>.col-6:nth-child(6){animation-delay:0.41s}.row.g-2>.col-6:nth-child(7){animation-delay:0.47s}.row.g-2>.col-6:nth-child(8){animation-delay:0.53s}
.avatar{box-shadow:0 0 0 4px rgba(143,120,216,.2),0 8px 20px rgba(143,120,216,.35)}
.orb{position:relative;background:radial-gradient(circle at 35% 30%,#d9cff5,#8f78d8);box-shadow:0 0 40px rgba(143,120,216,.7)}
.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px dashed rgba(143,120,216,.5);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav.bn{left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;padding:6px;border-radius:26px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 32px rgba(75,59,134,.18)}
nav.bn button{border-radius:18px;transition:background .25s,color .25s,box-shadow .25s}
nav.bn button.on{background:linear-gradient(135deg,#8f78d8,#b9a6f0);color:#fff;box-shadow:0 6px 14px rgba(143,120,216,.45)}
.toastx{background:rgba(43,37,66,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);bottom:112px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
.brand::before{display:none}
.lg-auth{width:140px;display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 18px rgba(143,120,216,.35))}
.lg-top{height:28px;width:auto}
.lg-load{width:120px;animation:lp 1.8s ease-in-out infinite}
@keyframes lp{50%{transform:scale(1.06);opacity:.75}}

/* ===== Auth ===== */
const fld=(id,l,t='text',x='')=>`<div class="mb-3"><label class="form-label" for="${id}">${l}</label><input class="form-control" id="${id}" type="${t}" ${x}><div class="invalid-feedback"></div></div>`;
function bad(id,m){const e=$('#'+id);e.classList.add('is-invalid');e.nextElementSibling.textContent=m;return false}
const clr=()=>document.querySelectorAll('.is-invalid').forEach(e=>e.classList.remove('is-invalid'));
const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function showAuth(m){
  $('#app').classList.add('d-none');$('#auth').classList.remove('d-none');
  const t={login:'Selamat datang kembali',reg:'Buat akunmu',forgot:'Atur ulang password'}[m];
  let f='';
  if(m=='reg')f=fld('n','Nama','text','autocomplete=name')+fld('e','Email','email')+fld('p','Password (min. 6 karakter)','password')+`<div class="mb-3"><label class="form-label" for="z">Zodiak</label><select class="form-select" id="z">${ZD.map(z=>`<option>${z[0]}</option>`).join('')}</select></div>`;
  if(m=='login')f=fld('e','Email','email')+fld('p','Password','password')+`<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="rm"><label class="form-check-label" for="rm">Ingat saya</label></div>`;
  if(m=='forgot')f=fld('e','Email terdaftar','email')+fld('p','Password baru (min. 6 karakter)','password');
  $('#auth').innerHTML=`<div class="text-center mb-4"><img src="${LOGO}" class="lg-auth" alt="Logo Inner Whisper"><h2 class="brand">Inner Whisper</h2><p class="text-secondary">${t}</p></div><form id="f" novalidate class="card-s">${f}<button class="btn btn-lv w-100">${{login:'Masuk',reg:'Daftar',forgot:'Simpan password baru'}[m]}</button></form>
  <p class="text-center small">${m=='login'?'<a href="#" onclick="showAuth(\'forgot\');return false">Lupa password?</a> · <a href="#" onclick="showAuth(\'reg\');return false">Daftar</a>':'<a href="#" onclick="showAuth(\'login\');return false">Kembali ke halaman masuk</a>'}</p>`;
  $('#f').onsubmit=e=>{e.preventDefault();clr();
    const em=($('#e').value||'').trim().toLowerCase(),pw=$('#p').value;let ok=true;
    if(m=='reg'&&!$('#n').value.trim())ok=bad('n','Nama wajib diisi');
    if(!okMail(em))ok=bad('e','Masukkan email yang valid');
    if(pw.length<6)ok=bad('p','Password minimal 6 karakter');
    if(!ok)return;
    const u=users.find(x=>x.email==em);
    if(m=='reg'){if(u)return bad('e','Email sudah terdaftar');
      users.push({id:Date.now(),name:$('#n').value.trim(),email:em,pass:hash(pw),zodiac:$('#z').value,major:'',career:null,result:null,road:[],learn:[],pf:[],cv:0,notes:[{t:'Selamat datang di Inner Whisper! Mulai dari Tes Karier.',d:new Date().toLocaleString('id-ID'),r:0}],bk:[]});save();toast('Akun dibuat. Silakan masuk.');showAuth('login')}
    else if(m=='forgot'){if(!u)return bad('e','Email tidak ditemukan');u.pass=hash(pw);save();toast('Password diperbarui');showAuth('login')}
    else{if(!u||u.pass!=hash(pw))return bad('p','Email atau password salah');
      const s={id:u.id};try{localStorage.removeItem('iw_s');sessionStorage.removeItem('iw_s');($('#rm').checked?localStorage:sessionStorage).setItem('iw_s',JSON.stringify(s))}catch{}me=u;enter()}
  };
}
function logout(){try{localStorage.removeItem('iw_s');sessionStorage.removeItem('iw_s')}catch{}me=null;load(400,()=>showAuth('login'))}
function enter(f){$('#auth').classList.add('d-none');$('#app').classList.remove('d-none');go('home',f)}

/* ===== Navigasi ===== */
const NAV=[['home','house','Beranda'],['test','clipboard2-check','Tes'],['explore','compass','Jelajah'],['expert','chat-dots','Pakar'],['me','person','Akun']];
function go(v,fast){
  if(!me)return;view=v;
  const draw=()=>{const m=$('#main');m.innerHTML=V[v]();m.style.animation='none';m.offsetWidth;m.style.animation='';window.scrollTo(0,0);
    $('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]==(NAV.some(m=>m[0]==v)?v:v=='result'?'test':v=='pay'?'expert':'home')?'on':''}" onclick="go('${n[0]}')">${ic(n[1])}${n[2]}</button>`).join('');
    const u=me.notes.filter(x=>!x.r).length;$('#bd').textContent=u||'';$('#bd').style.display=u?'':'none';
    if(V['_'+v])V['_'+v]()};
  fast?draw():load(350,draw);
}
const head=(t,s)=>`<h4 class="mb-1">${t}</h4><p class="text-secondary mb-3">${s||''}</p>`;
const cr=()=>CR.find(c=>c.id==me.career);
const pct=()=>{const t=5+LRN.length+1+1+PFC.length;const d=me.road.length+me.learn.length+(me.result?1:0)+(me.cv?1:0)+me.pf.length;return Math.round(d/t*100)};
const topCat=()=>me.result?Object.entries(me.result).sort((a,b)=>b[1]-a[1])[0][0]:null;
const bar=p=>`<div class="progress"><div class="progress-bar" style="width:${p}%"></div></div>`;
const tl=(i,t,v,d)=>`<div class="col-6"><button class="tile" onclick="go('${v}')"><span class="ico">${ic(i)}</span><div class="fw-bold">${t}</div><div class="small text-secondary">${d}</div></button></div>`;
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hello=()=>{const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<19?'Selamat sore':'Selamat malam'};
function nextStep(){
  if(!me.result)return['Ikuti Tes Karier','Jawab 25 pertanyaan untuk mengenali minat dan kekuatanmu.','test'];
  if(!cr())return['Pilih tujuan karier','Lihat hasil tesmu dan pilih satu karier.','result'];
  const st=RM[cr().c],i=st.findIndex((_,k)=>!me.road.includes(k));
  if(i>=0)return['Langkah roadmap berikutnya',st[i],'road'];
  return['Siap berkonsultasi?','Bahas rencana kariermu bersama konselor.','expert']}

const V={};
V.home=()=>{const n=nextStep();return `<div class="hero"><div class="d-flex justify-content-between align-items-center"><div><small>${hello()},</small><h3 class="mb-2">${esc(me.name.split(' ')[0])}</h3>${cr()?`<span class="chip">${cr().n}</span>`:'<small>Belum ada tujuan karier</small>'}</div><div class="ring" style="--p:${pct()}"><span>${pct()}%</span></div></div></div>
<button class="next" onclick="go('${n[2]}')"><div><small>Langkah berikutnya</small><b>${n[0]}</b><div class="small">${esc(n[1])}</div></div>${ic('map')}</button>
<h6 class="mt-4 mb-2">Fitur</h6><div class="row g-2">${tl('map','Roadmap','road','Langkah menuju kariermu')+tl('file-earmark-text','CV & Interview','cv','Cek CV, latihan wawancara')+tl('briefcase','Portofolio','pf','Susun karya terbaikmu')+tl('mortarboard','Belajar','learn','Modul singkat')+tl('graph-up','Progres','prog','Pantau perkembanganmu')+tl('stars','Zodiak Karier','zod','Pembacaan hiburan')+tl('journal-text','Artikel & Tips','art','Bacaan dunia kerja')+tl('credit-card','Pembayaran','pay','Tagihan dan riwayat')}</div>`};

V.test=()=>{
  if(qi==0&&me.result&&!ans.length)return head('Tes Karier','Kamu sudah pernah mengerjakan tes ini.')+`<button class="btn btn-lv me-2" onclick="go('result')">Lihat hasil</button><button class="btn btn-out" onclick="me.result=null;save();go('test',1)">Ulangi tes</button>`;
  const q=Q[qi];
  return head('Tes Karier',`Pertanyaan ${qi+1} dari ${Q.length}`)+bar(qi/Q.length*100)+`<h5 class="my-3">${q[0]}</h5>`+q[1].map((o,i)=>`<button class="opt" onclick="pick(${i})">${o[0]}</button>`).join('');
};
function pick(i){ans.push(Q[qi][1][i][1]);qi++;
  if(qi<Q.length)return go('test',1);
  const sc={};ans.forEach(c=>sc[c]=(sc[c]||0)+1);me.result=sc;note('Tes karier selesai. Lihat rekomendasi kariermu.');save();qi=0;ans=[];go('result')}
V.result=()=>{
  if(!me.result)return head('Rekomendasi Karier','Kerjakan Tes Karier dulu.')+`<button class="btn btn-lv" onclick="go('test')">Mulai tes</button>`;
  const ent=Object.entries(me.result).sort((a,b)=>b[1]-a[1]);const cats=ent.slice(0,2).map(e=>e[0]),tot=ent.reduce((a,e)=>a+e[1],0);
  return head('Rekomendasi Karier','Berdasarkan minat dan kekuatanmu.')+`<div class="card-s">${ent.map(e=>`<div class="mb-2"><div class="d-flex justify-content-between small"><span>${CAT[e[0]]}</span><span>${Math.round(e[1]/tot*100)}%</span></div>${bar(e[1]/tot*100)}</div>`).join('')}</div>`+
  CR.filter(c=>cats.includes(c.c)).sort((a,b)=>cats.indexOf(a.c)-cats.indexOf(b.c)).map(c=>`<div class="card-s"><h6>${c.n}</h6><p class="small mb-2">${c.d}</p><button class="btn btn-lv btn-sm" onclick="setCareer(${c.id})">${me.career==c.id?'Tujuan saat ini':'Jadikan tujuan'}</button></div>`).join('');
};
function setCareer(id){if(me.career!=id)me.road=[];me.career=id;note('Tujuan karier: '+cr().n+'. Roadmap siap diikuti.');save();toast('Tujuan karier disimpan');go('road')}

V.explore=()=>head('Career Explorer','Cari karier dan lihat keterampilan yang dibutuhkan.')+`<input class="form-control mb-2" id="q" placeholder="Cari karier atau keterampilan" oninput="exl()"><div class="mb-2" id="cf"><span class="chip on" onclick="fc('')">Semua</span>${Object.entries(CAT).map(e=>`<span class="chip" onclick="fc('${e[0]}')">${e[1]}</span>`).join('')}</div><div id="el"></div>`;
let fcat='';V._explore=()=>{fcat='';exl()};
function fc(c){fcat=c;document.querySelectorAll('#cf .chip').forEach((e,i)=>e.classList.toggle('on',(i==0&&!c)||(c&&e.textContent==CAT[c])));exl()}
function exl(){const q=($('#q').value||'').toLowerCase();const r=CR.filter(c=>(!fcat||c.c==fcat)&&(c.n+c.d+c.s.join()).toLowerCase().includes(q));
  $('#el').innerHTML=r.map(c=>`<div class="card-s"><h6 class="mb-1">${c.n}</h6><span class="chip">${CAT[c.c]}</span><p class="small my-2">${c.d}</p><div>${c.s.map(s=>`<span class="chip">${s}</span>`).join('')}</div><button class="btn btn-out btn-sm mt-2" onclick="setCareer(${c.id})">Pilih karier ini</button></div>`).join('')||'<p class="text-secondary">Tidak ada hasil. Coba kata kunci lain.</p>'}

V.road=()=>{if(!cr())return head('Career Roadmap','Pilih tujuan karier dulu agar langkahmu terarah.')+`<button class="btn btn-lv" onclick="go('explore')">Pilih karier</button>`;
  const st=RM[cr().c];return head('Roadmap: '+cr().n,'Centang langkah yang sudah kamu selesaikan.')+`<div class="card-s">${st.map((s,i)=>`<div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="r${i}" ${me.road.includes(i)?'checked':''} onchange="tg('road',${i})"><label class="form-check-label" for="r${i}">${s}</label></div>`).join('')}</div>`+bar(me.road.length/st.length*100)};
function tg(k,i){const a=me[k];a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);save();go(view,1)}

V.learn=()=>head('Career Learning','Modul singkat untuk membekali dirimu.')+LRN.map((l,i)=>`<div class="card-s d-flex justify-content-between align-items-center"><div><b>${l[0]}</b><div class="small text-secondary">${l[1]}</div></div><button class="btn btn-sm ${me.learn.includes(i)?'btn-lv':'btn-out'}" onclick="tg('learn',${i})">${me.learn.includes(i)?'Selesai':'Tandai selesai'}</button></div>`).join('');

V.pf=()=>head('Portfolio Guidance','Susun portofolio yang meyakinkan.')+`<div class="card-s">${cr()?`<p class="small"><b>Untuk ${cr().n}:</b> ${PF[cr().c]}</p>`:'<p class="small text-secondary">Pilih karier untuk saran yang lebih spesifik.</p>'}${PFC.map((s,i)=>`<div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="p${i}" ${me.pf.includes(i)?'checked':''} onchange="tg('pf',${i})"><label class="form-check-label" for="p${i}">${s}</label></div>`).join('')}</div>`;

const IQ=['Ceritakan tentang dirimu.','Apa kelebihan dan kekuranganmu?','Ceritakan pengalaman bekerja dalam tim.','Mengapa kamu tertarik pada posisi ini?'];

<h6 class="mt-4">Simulasi wawancara</h6><div class="card-s"><p class="fw-bold" id="iqt">${IQ[iq]}</p><textarea class="form-control mb-2" id="ia" rows="4" placeholder="Tulis jawabanmu"></textarea><button class="btn btn-lv me-2" onclick="chkI()">Cek jawaban</button><button class="btn btn-out" onclick="iq=(iq+1)%IQ.length;$('#iqt').textContent=IQ[iq];$('#ia').value='';$('#ir').innerHTML=''">Pertanyaan lain</button><div id="ir" class="mt-3 small"></div></div>`;
function chkCV(){const t=$('#cvt').value,w=t.trim().split(/\s+/).filter(Boolean).length;
  const c=[['Ada email',/\S+@\S+\.\S+/.test(t),'Cantumkan email aktif.'],['Ada nomor telepon',/(\+62|08)[\d\s-]{7,}/.test(t),'Cantumkan nomor yang bisa dihubungi.'],['Ada bagian pendidikan',/pendidikan|education/i.test(t),'Tambahkan riwayat pendidikan.'],['Ada pengalaman/organisasi',/pengalaman|magang|organisasi|experience/i.test(t),'Tambahkan magang, organisasi, atau proyek.'],['Ada keterampilan',/keterampilan|skill/i.test(t),'Tambahkan daftar keterampilan.'],['Memakai kata kerja aktif',/memimpin|mengelola|membuat|merancang|menganalisis|led |managed|built|designed/i.test(t),'Awali poin dengan kata kerja aktif.'],['Ada hasil terukur',/\d+\s?(%|orang|proyek|anggota|project)/i.test(t),'Tambahkan angka hasil kerjamu.'],['Panjang pas (120–600 kata)',w>=120&&w<=600,'Sesuaikan agar ringkas, idealnya satu halaman.']];
  const n=c.filter(x=>x[1]).length;me.cv=n>=6?1:me.cv;save();
  $('#cvr').innerHTML=`<b>Skor: ${Math.round(n/c.length*100)}/100</b>`+c.map(x=>`<div class="small">${x[1]?'✅':'❌'} ${x[1]?x[0]:x[2]}</div>`).join('')}
function chkI(){const t=$('#ia').value,w=t.trim().split(/\s+/).filter(Boolean).length,r=[];
  r.push(w>=40?'✅ Panjang jawaban sudah cukup.':'❌ Jawabanmu terlalu singkat. Tulis minimal 40 kata.');
  r.push(/misalnya|contoh|ketika|saat itu|pernah/i.test(t)?'✅ Ada contoh nyata.':'❌ Tambahkan contoh pengalaman nyata.');
  r.push(/hasil|berhasil|meningkat|selesai|belajar/i.test(t)?'✅ Ada hasil atau pelajaran.':'❌ Tutup dengan hasil atau pelajaran yang kamu dapat.');
  $('#ir').innerHTML=r.map(x=>`<div>${x}</div>`).join('')}

V.zod=()=>{const z=ZD.find(x=>x[0]==me.zodiac)||ZD[0],x=ZX[z[0]],k=(Math.floor(Date.now()/864e5)+ZD.indexOf(z)+zr)%ZP.length;
  const sec=(t,b)=>`<div class="card-s"><b>${t}</b><p class="mb-0 mt-1">${b}</p></div>`;
  return head('Zodiac Career Reading','Hanya hiburan, bukan penentu kariermu.')+`<div class="card-s sky"><h5 class="mb-1">${z[0]} <small class="text-secondary">${z[1]}</small></h5><p class="mb-0">${z[2]}</p></div>`+sec('Kekuatan di dunia kerja',x[0])+sec('Tantangan',x[1])+sec('Saran karier',x[2])+sec('Karier yang cocok',z[3])+
  `<div class="card-s" style="background:var(--lvl)"><b>Pesan karier hari ini</b><p class="mt-1">${ZP[k]}</p><button class="btn btn-lv btn-sm" onclick="zr++;go('zod',1)">Baca pesan lain</button></div><label class="form-label small" for="zs">Lihat zodiak lain</label><select class="form-select" id="zs" onchange="me.zodiac=this.value;save();zr=0;go('zod',1)">${ZD.map(y=>`<option ${y[0]==z[0]?'selected':''}>${y[0]}</option>`).join('')}</select>`};

V.art=()=>head('Artikel & Tips Karier')+`<div class="accordion">${AR.map((a,i)=>`<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#a${i}">${a[0]}</button></h2><div id="a${i}" class="accordion-collapse collapse"><div class="accordion-body">${a[1]}</div></div></div>`).join('')}</div>`;

V.notif=()=>{me.notes.forEach(n=>n.r=1);save();$('#bd').style.display='none';return head('Notifikasi')+(me.notes.map(n=>`<div class="card-s"><div>${esc(n.t)}</div><div class="small text-secondary">${n.d}</div></div>`).join('')||'<p class="text-secondary">Belum ada notifikasi.</p>')};

V.expert=()=>{const e=EX[0],today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  return head('Konsultasi Pakar','Sesi 45 menit untuk membahas arah kariermu.')+`<div class="card-s d-flex gap-3 align-items-center"><div class="avatar">${ini(e.n)}</div><div><b>${e.n}</b><div class="small text-secondary">${e.r}</div><div class="fw-bold mt-1" style="color:var(--lvd)">${rp(e.p)} / sesi</div></div></div>
  <form class="card-s" onsubmit="book(event)"><h6 class="mb-3">Pesan sesi</h6><div class="row g-2 mb-2"><div class="col"><label class="form-label small" for="bd2">Tanggal</label><input type="date" class="form-control" id="bd2" min="${today}" required></div><div class="col"><label class="form-label small" for="bt">Jam</label><select class="form-select" id="bt"><option>09:00</option><option>11:00</option><option>14:00</option><option>16:00</option></select></div></div><label class="form-label small" for="bp">Topik</label><input class="form-control mb-3" id="bp" placeholder="Contoh: bingung memilih peminatan" required><button class="btn btn-lv w-100">Pesan sesi · ${rp(e.p)}</button></form>`+
  (me.bk.length?'<h6 class="mt-4">Jadwalmu</h6>'+me.bk.map(b=>`<div class="card-s"><b>${b.date} · ${b.time}</b><div class="small">${esc(b.topic)}</div><span class="chip mt-2 ${b.paid?'on':''}">${b.paid?'Lunas':'Menunggu pembayaran'}</span></div>`).join(''):'')};
function book(ev){ev.preventDefault();me.bk.push({id:Date.now(),e:0,date:$('#bd2').value,time:$('#bt').value,topic:$('#bp').value.trim(),paid:0});note('Sesi konsultasi dipesan. Selesaikan pembayaran untuk konfirmasi.');save();toast('Sesi dipesan');go('pay')}

V.pay=()=>{const u=me.bk.filter(b=>!b.paid),p=me.bk.filter(b=>b.paid);
  return head('Pembayaran','Pembayaran bersifat simulasi.')+(u.map(b=>`<div class="card-s"><b>${EX[0].n}</b><div class="small mb-2">${b.date} · ${b.time} · ${rp(EX[0].p)}</div><select class="form-select mb-2" id="m${b.id}" aria-label="Metode">${MET.map(m=>`<option>${m}</option>`).join('')}</select><button class="btn btn-lv w-100" onclick="pay(${b.id})">Bayar ${rp(EX[0].p)}</button></div>`).join('')||'<p class="text-secondary">Tidak ada tagihan. Pesan sesi di menu Pakar.</p>')+(p.length?'<h6 class="mt-3">Riwayat</h6>'+p.map(b=>`<div class="card-s small"><b>${EX[0].n}</b> · ${rp(EX[0].p)} · ${b.method} · No. ${b.ref}</div>`).join(''):'')};
let paying=0;function pay(id){const b=me.bk.find(x=>x.id==id);if(paying||b.paid)return;paying=1;b.method=$('#m'+id).value;load(1100,()=>{paying=0;b.paid=1;b.ref='IW'+String(id).slice(-6);note('Pembayaran berhasil untuk sesi bersama '+EX[0].n+'.');save();toast('Pembayaran berhasil');go('pay',1)})}

V.me=()=>`<div class="card-s text-center pt-4"><div class="avatar lg mx-auto">${ini(me.name)}</div><h5 class="mt-3 mb-0">${esc(me.name)}</h5><div class="small text-secondary">${esc(me.email)}</div>${me.major||me.uni?`<div class="small mt-1">${esc([me.major,me.uni].filter(Boolean).join(' · '))}</div>`:''}${me.bio?`<p class="small mt-2 mb-0">${esc(me.bio)}</p>`:''}<div class="mt-3"><span class="chip">${esc(me.zodiac)}</span><span class="chip">${cr()?cr().n:'Belum ada tujuan'}</span><span class="chip">Progres ${pct()}%</span></div></div>
<form class="card-s" id="pf2" novalidate><h6 class="mb-3">Edit profil</h6>${fld('pn','Nama','text','value="'+esc(me.name)+'"')}${fld('pe','Email','email','value="'+esc(me.email)+'"')}${fld('pm','Jurusan / program studi','text','value="'+esc(me.major)+'"')}${fld('pu','Universitas','text','value="'+esc(me.uni)+'"')}<div class="mb-3"><label class="form-label" for="pb">Bio singkat</label><textarea class="form-control" id="pb" rows="2" maxlength="140" placeholder="Contoh: Tertarik pada pemasaran digital">${esc(me.bio)}</textarea></div><div class="mb-3"><label class="form-label" for="pz">Zodiak</label><select class="form-select" id="pz">${ZD.map(z=>`<option ${z[0]==me.zodiac?'selected':''}>${z[0]}</option>`).join('')}</select></div>${fld('pp','Password baru (kosongkan jika tidak diganti)','password')}<button class="btn btn-lv w-100">Simpan perubahan</button></form><button class="btn btn-out w-100" onclick="logout()">Keluar</button>`;
V._me=()=>{$('#pf2').onsubmit=e=>{e.preventDefault();clr();const n=$('#pn').value.trim(),em=$('#pe').value.trim().toLowerCase(),pw=$('#pp').value;let ok=true;
  if(!n)ok=bad('pn','Nama wajib diisi');
  if(!okMail(em))ok=bad('pe','Masukkan email yang valid');else if(users.some(u=>u.email==em&&u.id!=me.id))ok=bad('pe','Email sudah dipakai akun lain');
  if(pw&&pw.length<6)ok=bad('pp','Password minimal 6 karakter');
  if(!ok)return;
  Object.assign(me,{name:n,email:em,major:$('#pm').value.trim(),uni:$('#pu').value.trim(),bio:$('#pb').value.trim(),zodiac:$('#pz').value});
  if(pw)me.pass=hash(pw);note('Profilmu berhasil diperbarui.');toast('Profil disimpan');go('me',1)}};

/* ===== Mulai ===== */
load(900,()=>{const s=sess();me=s&&users.find(u=>u.id==s.id)||null;me?enter(1):showAuth('login')});
</script>
</body>
</html>
